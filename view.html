<!DOCTYPE html>
<html>

<head>

<title>Emergency Details</title>

<style>

body{
font-family:Arial;
background:#ff4e50;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
padding:20px;
box-sizing:border-box;
}

.card{
background:white;
padding:25px;
border-radius:15px;
width:350px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

h2{
color:red;
margin-bottom:20px;
}

.info{
text-align:left;
background:#f8f8f8;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

p{
margin:10px 0;
font-size:15px;
}

.label{
font-weight:bold;
}

button{
padding:12px;
width:100%;
margin-top:10px;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
}

.call{
background:red;
color:white;
}

.sms{
background:#007bff;
color:white;
}

.hospital{
background:#28a745;
color:white;
}

</style>

</head>

<body>

<div class="card">

<h2>🚨 EMERGENCY DETAILS</h2>

<div class="info">

<p id="name"></p>

<p id="blood"></p>

<p id="phone"></p>

<p id="phone2"></p>

<p id="address"></p>

<p id="medical"></p>

</div>

<button class="call" id="callBtn">
📞 Call Primary Contact
</button>

<button class="sms" id="smsBtn">
📩 Send SMS
</button>

<button class="hospital" id="hospitalBtn">
🏥 Nearby Hospitals
</button>

</div>


<script>


// Get URL parameters

let params =
new URLSearchParams(window.location.search);


// Emergency details

let name =
params.get("name") || "Not provided";

let blood =
params.get("blood") || "Not provided";

let phone =
params.get("phone") || "Not provided";

let phone2 =
params.get("phone2") || "Not provided";

let address =
params.get("address") || "Not provided";

let medical =
params.get("medical") || "None";


// Display information

document.getElementById("name").innerHTML =
"<span class='label'>👤 Name:</span> " +
name;

document.getElementById("blood").innerHTML =
"<span class='label'>🩸 Blood Group:</span> " +
blood;

document.getElementById("phone").innerHTML =
"<span class='label'>📞 Primary Contact:</span> " +
phone;

document.getElementById("phone2").innerHTML =
"<span class='label'>📱 Second Contact:</span> " +
phone2;

document.getElementById("address").innerHTML =
"<span class='label'>📍 Address:</span> " +
address;

document.getElementById("medical").innerHTML =
"<span class='label'>🏥 Medical Conditions:</span> " +
medical;


// Call button

document.getElementById("callBtn").onclick =
function(){

    if(phone !== "Not provided"){

        window.location.href =
        "tel:" + phone;

    }

};


// SMS button

document.getElementById("smsBtn").onclick =
function(){

    if(phone !== "Not provided"){

        let message =
        "Emergency Alert for " +
        name +
        ". Blood Group: " +
        blood +
        ". Medical Conditions: " +
        medical;

        window.location.href =
        "sms:" +
        phone +
        "?body=" +
        encodeURIComponent(message);

    }

};


// Nearby hospitals

document.getElementById("hospitalBtn").onclick =
function(){

    if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition(

            function(pos){

                let lat =
                pos.coords.latitude;

                let lon =
                pos.coords.longitude;

                let url =
                "https://www.google.com/maps/search/hospitals/@" +
                lat + "," +
                lon +
                ",15z";

                window.open(
                    url,
                    "_blank"
                );

            },

            function(){

                alert(
                    "Location permission is required to find nearby hospitals."
                );

            }

        );

    }
    else{

        alert(
            "Geolocation is not supported by this browser."
        );

    }

};

</script>

</body>

</html>
